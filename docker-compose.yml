version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeff_portfolio_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./portfolio.db
      - SECRET_KEY=portfolio_jwt_secret_key_production_grade_super_secure_2026_x
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - UPLOAD_DIR=./uploads
    volumes:
      - ./backend/portfolio.db:/app/portfolio.db
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jeff_portfolio_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
